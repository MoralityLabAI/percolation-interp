name: PercInterp library

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/library.yml'
      - 'src/percinterp/**'
      - 'examples/from_attribution_edges.py'
      - 'tests/test_interop.py'
      - 'tests/test_indexed_archive.py'
      - 'tests/test_reference_benchmark.py'
      - 'tests/test_goodfire_component_key.py'
      - 'benchmarks/**'
      - 'examples/**'
      - 'pyproject.toml'
  pull_request:
    paths:
      - '.github/workflows/library.yml'
      - 'src/percinterp/**'
      - 'examples/from_attribution_edges.py'
      - 'tests/test_interop.py'
      - 'tests/test_indexed_archive.py'
      - 'tests/test_reference_benchmark.py'
      - 'tests/test_goodfire_component_key.py'
      - 'benchmarks/**'
      - 'examples/**'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install library and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest build
      - name: Check core graph and interchange APIs
        run: python -m pytest -q tests/test_interop.py tests/test_indexed_archive.py tests/test_reference_benchmark.py tests/test_measure.py tests/test_sieve.py tests/test_theory.py
      - name: Run documented example
        run: python examples/from_attribution_edges.py
      - name: Build wheel and source distribution
        run: python -m build

  goodfire-identifier-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PercInterp and pinned Goodfire formats
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python -m pip install 'git+https://github.com/goodfire-ai/param-decomp.git@177d0cce809896d9d84b2bd04bbc2e319c64e9d0#subdirectory=param_decomp_formats'
      - name: Test Goodfire native component key contract
        run: |
          python -m pytest -q tests/test_goodfire_component_key.py
          python examples/goodfire_component_keys.py

  reference-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU library
        run: python -m pip install -e .
      - name: Benchmark against exact SciPy traversal
        run: |
          python benchmarks/profile_vs_resweep.py --width 192 --points 41 --repeats 5 --output out/benchmark.json
      - name: Retain benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: percinterp-scipy-reference
          path: out/benchmark.json
          retention-days: 14
