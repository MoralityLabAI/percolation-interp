name: PercInterp E08 site

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/percinterp-pages.yml'
      - 'ui/godel_globe/**'
      - 'src/percinterp/cycle_filtration.py'
      - 'src/percinterp/holonomy.py'
      - 'experiments/e08_holonomy_percolation.py'
      - 'experiments/e08_build_site.py'
      - 'tests/test_holonomy_percolation.py'
      - 'tests/test_e08_site.py'
      - 'tests/test_e09_utility_audit.py'
      - 'experiments/e09_utility_audit.py'
      - 'docs/e09_utility_decision.md'
      - 'docs/e10_decisive_gate.md'
      - 'src/percinterp/selector_gate.py'
      - 'src/percinterp/causal_gate.py'
      - 'experiments/e10_prepare.py'
      - 'experiments/e10_e03_causal.py'
      - 'experiments/e10_score.py'
      - 'tests/test_e10_selectors.py'
      - 'tests/test_e10_runner_mock.py'
      - 'experiments/e10_run_local.py'
      - 'tests/test_e10_run_local.py'
      - 'experiments/e10_preflight.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: percinterp-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Verify E08 E09 and E10 CPU gates
        run: python -m pytest -q tests/test_holonomy_percolation.py tests/test_e08_site.py tests/test_e09_utility_audit.py tests/test_e10_selectors.py tests/test_e10_runner_mock.py tests/test_e10_run_local.py
      - name: Syntax-check optional E10 causal driver
        run: python -m compileall -q experiments/e10_e03_causal.py experiments/e10_score.py experiments/e10_run_local.py
      - name: Build static Pages payload
        run: python experiments/e08_build_site.py --output site
      - name: Audit historical percolation utility
        run: python experiments/e09_utility_audit.py --output site/utility_audit.json
      - name: Export E10 synthetic selector fixture
        run: python experiments/e10_prepare.py --fixture --output site/e10_fixture.json
      - name: Export E10 historical degree preflight
        run: python experiments/e10_preflight.py --output site/e10_preflight.json
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
