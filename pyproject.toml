[project]
name = "percinterp"
version = "0.1.0"
description = "Percolation profiles and null controls for neural influence graphs"
readme = "README.md"
keywords = ["percolation", "mechanistic interpretability", "attribution graph", "neural circuits"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Patrick Dugan" }]
requires-python = ">=3.11"
# Core (graph, measure, theory, controls, sieve) needs only numpy and scipy.
dependencies = ["numpy>=1.25", "scipy>=1.11"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# dense (batched GPU measurements), modadd (step 2 models), sae (TopK SAEs)
torch = ["torch>=2.2"]
# plotstyle, used by the experiment scripts' figures
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8", "torch>=2.2", "matplotlib>=3.8"]

[project.urls]
Repository = "https://github.com/MoralityLabAI/percolation-interp"
Documentation = "https://github.com/MoralityLabAI/percolation-interp/blob/master/docs/GOODFIRE_INTEGRATION.md"
Issues = "https://github.com/MoralityLabAI/percolation-interp/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
