[project]
name = "percinterp"
version = "0.1.0"
description = "Percolation theory applied to mechanistic-interpretability influence graphs"
requires-python = ">=3.11"
dependencies = ["numpy>=1.25", "scipy>=1.11", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
