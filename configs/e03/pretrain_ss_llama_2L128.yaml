# e03 target model: param-decomp ss_llama_simple_mlp-2L-128, offline (no wandb), scaled for a shared 16 GB GPU.
wandb_project: null
dtype: bfloat16
batch_size: 128
num_iterations: 8000
warmup_iters: 300
learning_rate: 1e-3
learning_rate_decay_frac: 0.1
weight_decay: 0.1
grad_clip: 1.0
val_loss_every: 500
val_max_steps: 20
sample_every: 2000
intermediate_checkpoints: false
compile: false  # torch.compile needs Triton, unreliable on Windows

model:
  model_type: LlamaSimpleMLP
  block_size: 512
  vocab_size: 4019
  n_layer: 2
  n_head: 4
  n_embd: 128
  n_intermediate: 512  # 128 * 4
  rotary_dim: 32       # 128 // 4
  n_ctx: 512
  n_key_value_heads: 2
  flash_attention: false

train_dataset_config:
  name: SimpleStories/SimpleStories
  is_tokenized: false
  hf_tokenizer_path: SimpleStories/test-SimpleStories-gpt2-1.25M
  split: train
  streaming: false
  n_ctx: 513  # model n_ctx + 1 for next-token label indexing
  seed: 0
  column_name: story

val_dataset_config:
  name: SimpleStories/SimpleStories
  is_tokenized: false
  hf_tokenizer_path: SimpleStories/test-SimpleStories-gpt2-1.25M
  split: test
  streaming: false
  n_ctx: 513  # model n_ctx + 1 for next-token label indexing
  seed: 0
  column_name: story
